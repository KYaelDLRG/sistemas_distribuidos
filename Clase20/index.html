<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ejercicio 1 - NGINX Reverse Proxy para endpoint /task con multiplicación de números">
    <title>Multiplicación de Números - NGINX</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="card-container">
        <h1 class="titulo">Escribe los numeros que deseas multiplicar separados por comas</h1>
        
        <div class="input-container">
            <textarea id="numerosInput" rows="4" placeholder="3,4,5,6" autofocus>3,4,5,6</textarea>
        </div>

        <div class="button-container">
            <button id="btnEnviar" type="button">Enviar</button>
        </div>

        <div class="respuesta-container">
            <h2 class="subtitulo">Respuesta del servidor:</h2>
            <div id="resultadoBox" class="resultado-box">
                El resultado de la multiplicación es 360
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
