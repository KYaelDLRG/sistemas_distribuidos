# ==============================================================================
# Configuración NGINX - Ejercicio 2: Balanceador de Carga (Load Balancer)
# Ubicación en Linux/WSL: /etc/nginx/sites-available/loadbalancer
# Enlace simbólico: sudo ln -s /etc/nginx/sites-available/loadbalancer /etc/nginx/sites-enabled/
# ==============================================================================

# Grupo de servidores backend en Java
upstream backend_java {
    server localhost:8080;
    server localhost:8081;
    server localhost:8082;
}

# Servidor frontal NGINX que distribuye las peticiones (Round Robin por defecto)
server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://backend_java;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
