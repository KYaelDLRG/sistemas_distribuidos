# ==============================================================================
# Configuración NGINX - Ejercicio 1: Reverse Proxy con Frontend y Backend
# Ubicación recomendada en Linux/WSL: /etc/nginx/sites-available/default
# o /etc/nginx/sites-enabled/default
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Carpeta donde se alojan los archivos estáticos (index.html, estilos.css, app.js)
    root /var/www/ejemplo;
    index index.html;

    # Servir archivos estáticos del frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirección reverse proxy para el endpoint /task al backend Java (puerto 8080)
    location /task {
        proxy_pass http://localhost:8080/task;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirección reverse proxy para el endpoint /status
    location /status {
        proxy_pass http://localhost:8080/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
